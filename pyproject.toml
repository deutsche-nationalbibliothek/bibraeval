[project]
name = "bibraeval"
version = "0.0.1-dev"
description = "Evaluating descriptive cataloguing records created with BIBRA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bibra>=0.1.0",
    "dvc>=3.67.1",
    "dvc-ssh>=4.3.0",
    "levenshtein>=0.27.4",
    "polars>=1.44.2",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "scipy>=1.18.1",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff~=0.16.0",
    "pre-commit>=4.6.0",
    "bump-my-version>=1.3.0",
    "ipykernel>=7.3.0",
]

[tool.bumpversion]
current_version = "0.2.0-dev"
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:
        -                             # dash separator for pre-release section
        (?P<release>[a-zA-Z-]+)       # pre-release label
    )?                                # pre-release section is optional
"""
serialize = [
    "{major}.{minor}.{patch}-{release}",
    "{major}.{minor}.{patch}",
]
tag = true
sign_tags = true
commit = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[tool.bumpversion.parts.release]
values = ["dev", "prod"]
optional_value = "prod"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
